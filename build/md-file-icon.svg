<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient from light orange to darker orange (orange to orange-red) -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gradient background -->
  <rect width="512" height="512" fill="url(#orangeGradient)" rx="50"/>
  
  <!-- Large "S" on top-left (1.3x more) -->
  <text x="50" y="280" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="364" font-weight="bold">S</text>
  
  <!-- Large "MD" at bottom (lower to avoid overlap) -->
  <text x="256" y="460" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="180" font-weight="bold" text-anchor="middle">MD</text>
</svg>
